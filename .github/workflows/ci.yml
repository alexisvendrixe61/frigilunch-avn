name: CI

on:
  push:
    branches: ["council/build-*", "main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check frigilunch/

      - name: Unit tests with coverage
        run: pytest tests/unit/ --cov=frigilunch --cov-report=term-missing --cov-fail-under=70 -q
