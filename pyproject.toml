[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "frigilunch"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["ortools>=9.8"]

[project.optional-dependencies]
dev = ["ruff>=0.4", "pytest>=8", "pytest-cov>=5"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C90"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.coverage.run]
source = ["frigilunch"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true
